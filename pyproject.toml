# ===============================
# WORKSPACE MASTER PYPROJECT FILE
# ===============================

# Every subproject here may have a deparate entry in PyPi
# tagging must be per-project. Example: git tag nixnox-dao-0.1.0
[tool.uv.workspace]
members = [
    "packages/nixnox-dao", 
    "packages/nixnox-core", 
    "packages/nixnox-api", 
    "packages/nixnox-tools", 
    "packages/nixnox-web",
]

[tool.uv.sources]
nixnox-dao = { workspace = true }
nixnox-core = { workspace = true }
nixnox-api = { workspace = true }


[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
]