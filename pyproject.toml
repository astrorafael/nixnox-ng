# ===============================
# WORKSPACE MASTER PYPROJECT FILE
# ===============================

# Every subproject here may have a deparate entry in PyPi
# tagging must be per-project: git tag nixnox-dao-0.1.0
[tool.uv.workspace]
members = ["packages/nixnox-dao"]

[tool.uv.sources]
nixnox-dao = { workspace = true }


[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
]