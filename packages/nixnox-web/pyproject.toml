[project]
name = "nixnox-web"
dynamic = ["version"]
description = "NIXNOX Web Application"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [
    {name = "Rafael González", email = "rafael08@ucm.es"},
    {name = "Jaime Zamorano", email ="jzamoran@ucm.es"}
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "nixnox-dao",
    "nixnox-api",
    "python-dateutil",
    "streamlit",
    "pydantic",
    "email-validator",
    "pandas",
]


[project.scripts]
# Additional tools.
nixnox-web = "nixnox_web.main:main"


# ------------------------
# DYNAMIC VERSIONING STUFF
# ------------------------

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"


[tool.hatch.build.targets.wheel]
packages = ["src/nixnox-web",]
only-include = ["src/nixnox_web"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv-dynamic-versioning]
fallback-version = "0.1.0"

# -----------
# Other stuff
# -----------

[tool.ruff]
line-length = 100

