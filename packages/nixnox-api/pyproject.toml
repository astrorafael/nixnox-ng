[project]
name = "nixnox-api"
dynamic = ["version"]
description = "NIXNOX core library and HTTP API"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [
    {name = "Rafael González", email = "rafael08@ucm.es"},
    {name = "Jaime Zamorano", email ="jzamoran@ucm.es"}
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    # core subpackage needs these dependencies
    "nixnox-dao",
    "geopy",
    "pytz",
    "timezonefinder",
    "astropy",
    "scipy",
    "matplotlib",
    # http subpackage needs these dependencies
    "pydantic",
    "fastapi[standard-no-fastapi-cloud-cli]",
]


[project.scripts]
# Additional tools.
nx-api-server = "nixnox_api.http.cli.server:main"

# ------------------------
# DYNAMIC VERSIONING STUFF
# ------------------------

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"


[tool.hatch.build.targets.wheel]
packages = ["src/nixnox-api",]
only-include = ["src/nixnox_api"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv-dynamic-versioning]
fallback-version = "0.1.0"

# -----------
# Other stuff
# -----------

[tool.ruff]
line-length = 100

