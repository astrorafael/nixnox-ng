[project]
name = "nixnox-dao"
dynamic = ["version"]
description = "NIXNOX Data Access Object layer in SQLAlchemy"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [
    {name = "Rafael González", email = "rafael08@ucm.es"},
    {name = "Jaime Zamorano", email ="jzamoran@ucm.es"}
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
  "SQLAlchemy[asyncio]>=2.0",
  "alembic",
  "aiosqlite", # asyncio sqlite connector
  "sqlalchemy-libsql", # For libSQL variant of SQLite, see https://github.com/tursodatabase/libsql
  "lica[aiosqlalchemy]>=2.0", # needs lica library from 2.x on
  "pytz"
]


[project.scripts]
# Additional tools.
nx-db-schema = "nixnox_dao.nixnox.cli.schema:main"
nx-db-populate = "nixnox_dao.nixnox.cli.populate:main"
nx-auth-schema = "nixnox_dao.auth.cli.schema:main"
nx-auth-admin = "nixnox_dao.auth.cli.admin:main"

# ------------------------
# DYNAMIC VERSIONING STUFF
# ------------------------

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"


[tool.hatch.build.targets.wheel]
packages = ["src/nixnox-dao",]
only-include = ["src/nixnox_dao", "scripts"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"scripts" = "nixnox-dao/scripts"

[tool.uv-dynamic-versioning]
fallback-version = "0.1.0"

# -----------
# Other stuff
# -----------

[tool.ruff]
line-length = 100

